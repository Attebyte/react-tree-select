<!doctype html>
<!-- Source for static/img/social-card.png (1200x630). Open over HTTP and screenshot the viewport at 1200x630 to regenerate. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; display: flex; font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #1e1b4b, #312e81 60%, #4338ca); color: #fff; }
  .copy { flex: 1; padding: 80px 0 80px 80px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 88px; height: 88px; margin-bottom: 36px; }
  h1 { font-size: 76px; margin: 0 0 20px; letter-spacing: -1px; }
  p { font-size: 32px; margin: 0 0 36px; color: #c7d2fe; line-height: 1.35; max-width: 620px; }
  code { font-size: 26px; background: rgba(255,255,255,.12); padding: 10px 18px; border-radius: 10px; align-self: flex-start; }
  .tree { width: 400px; margin: auto 80px auto 0; background: #fff; color: #1e1b4b; border-radius: 20px; padding: 32px 36px; font-size: 28px; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
  .row { display: flex; align-items: center; gap: 14px; height: 52px; }
  .box { width: 26px; height: 26px; border: 2.5px solid #1e1b4b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
  .on { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .mixed::after { content: ''; width: 12px; height: 12px; background: #4f46e5; border-radius: 2px; }
  .l1 { padding-left: 40px; } .l2 { padding-left: 80px; }
  .arrow { color: #6366f1; font-size: 18px; }
</style>
</head>
<body>
  <div class="copy">
    <img class="logo" src="../static/img/logo.svg" alt="">
    <h1>React Tree Select</h1>
    <p>Accessible, customizable checkbox tree for React with tri-state selection and keyboard navigation.</p>
    <code>npm i @attebyte/react-tree-select</code>
  </div>
  <div class="tree">
    <div class="row"><span class="box mixed"></span>Documents <span class="arrow">▼</span></div>
    <div class="row l1"><span class="box on">✓</span>Reports <span class="arrow">▼</span></div>
    <div class="row l2"><span class="box on">✓</span>Q3.pdf</div>
    <div class="row l2"><span class="box on">✓</span>Q4.pdf</div>
    <div class="row l1"><span class="box"></span>Drafts</div>
    <div class="row"><span class="box"></span>Photos <span class="arrow">▲</span></div>
  </div>
</body>
</html>
